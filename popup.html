<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Media Collector</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        width: 380px;
        max-height: 600px;
        padding: 18px;
        margin: 0;

        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

        background: #111;
        color: #fff;
      }

      header {
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 5px;
        font-size: 18px;
        font-weight: 600;
      }

      #status {
        margin: 0;
        color: #888;
        font-size: 13px;
      }

      button {
        font-family: inherit;
      }

      #scanButton,
      #downloadButton {
        position: relative;
        overflow: hidden;

        width: 100%;
        padding: 12px;
        margin-top: 14px;

        border: 0;
        border-radius: 7px;

        background: #fff;
        color: #111;

        font-size: 14px;
        font-weight: 600;

        cursor: pointer;

        transition:
          background 0.25s ease,
          color 0.25s ease;
      }

      #downloadButton::before {
        content: "";

        position: absolute;
        inset: 0;

        width: var(--progress, 0%);

        background: #22c55e;

        transition: width 0.25s ease;

        z-index: 0;
      }

      #downloadButton span {
        position: relative;
        z-index: 1;
      }

      #downloadButton.complete {
        background: #22c55e;
        color: #fff;
      }

      #downloadButton.complete::before {
        width: 100%;
      }

      #scanButton {
        margin-bottom: 18px;

        background: #fff;
        color: #111;
      }

      #downloadButton {
        margin-top: 14px;

        background: #fff;
        color: #111;
      }

      button:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .summary {
        display: flex;
        align-items: baseline;
        gap: 7px;

        margin-bottom: 12px;
      }

      #count {
        font-size: 30px;
        font-weight: 600;
      }

      .label {
        color: #888;
        font-size: 12px;
      }

      /* --------------------------------------------------
         MEDIA FILTER
         -------------------------------------------------- */

      #mediaFilter {
        display: none;

        grid-template-columns: repeat(3, 1fr);

        padding: 3px;
        margin-bottom: 14px;

        background: #1c1c1c;
        border-radius: 7px;
      }

      .filter-button {
        padding: 7px 8px;

        border: 0;
        border-radius: 5px;

        background: transparent;
        color: #777;

        font-size: 11px;
        font-weight: 600;

        cursor: pointer;

        transition:
          background 0.2s ease,
          color 0.2s ease;
      }

      .filter-button.active {
        background: #fff;
        color: #111;
      }

      #controls {
        display: none;

        justify-content: space-between;
        align-items: center;

        margin-bottom: 12px;

        font-size: 12px;
        color: #aaa;
      }

      #selectAllLabel {
        display: flex;
        align-items: center;
        gap: 6px;

        cursor: pointer;
      }

      #gallery {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
      }

      .media {
        position: relative;

        aspect-ratio: 1;
        overflow: hidden;

        background: #222;
        border-radius: 4px;

        cursor: pointer;

        border: 2px solid transparent;
      }

      .media.selected {
        border-color: #fff;
      }

      .media img {
        width: 100%;
        height: 100%;

        object-fit: cover;
        display: block;
      }

      .media:not(.selected) img {
        opacity: 0.45;
      }

      .media-number {
        position: absolute;

        right: 5px;
        bottom: 5px;

        min-width: 20px;
        padding: 3px 5px;

        border-radius: 4px;

        background: rgba(0, 0, 0, 0.7);

        color: #fff;
        font-size: 10px;
        text-align: center;
      }

      .check {
        position: absolute;

        top: 6px;
        left: 6px;

        width: 18px;
        height: 18px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;

        background: rgba(0, 0, 0, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.8);

        font-size: 11px;
        font-weight: 700;
      }

      .media:not(.selected) .check {
        color: transparent;
      }

      .video-badge {
        position: absolute;

        top: 6px;
        right: 6px;

        padding: 3px 5px;

        border-radius: 4px;

        background: rgba(0, 0, 0, 0.75);

        color: #fff;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      #downloadArea {
        display: none;
      }

      #downloadStatus {
        margin-top: 8px;

        min-height: 14px;

        color: #22c55e;
        font-size: 11px;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Media Collector</h1>
      <p id="status">Ready</p>
    </header>

    <button id="scanButton">Scan Post</button>

    <div class="summary">
      <div id="count">0</div>
      <div class="label" id="countLabel">media detected</div>
    </div>

    <div id="mediaFilter">
      <button class="filter-button active" data-filter="both">Both</button>

      <button class="filter-button" data-filter="image">Images</button>

      <button class="filter-button" data-filter="video">Videos</button>
    </div>

    <div id="controls">
      <label id="selectAllLabel">
        <input type="checkbox" id="selectAll" checked />

        Select all
      </label>

      <span id="selectedCount">0 selected</span>
    </div>

    <div id="gallery"></div>

    <div id="downloadArea">
      <button id="downloadButton">
        <span id="downloadButtonText">Download Selected</span>
      </button>

      <div id="downloadStatus"></div>
    </div>

    <script src="adapters/instagram.js"></script>
    <script src="adapters/router.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
